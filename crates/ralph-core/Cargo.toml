[package]
name = "ralph-core"
version = "0.1.0"
edition = "2021"
description = "Core loop engine for AI agent orchestration"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "signal", "io-util", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
regex = "1"
netstat2 = "0.11"
sysinfo = "0.37"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
