[package]
name = "ralph-core"
version = "0.1.0"
edition = "2021"
description = "Core loop engine for AI agent orchestration"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
async-trait = "0.1.89"
