pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "**/*.{ts,tsx,js,jsx,json,css}"
      run: bunx biome check --no-errors-on-unmatched --changed --since=HEAD {staged_files}
      stage_fixed: true
    rust-fmt:
      glob: "**/*.rs"
      run: cargo fmt --all -- --check
    rust-clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace -- -D warnings
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
